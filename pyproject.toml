[project]
name = "plantpilot"
version = "0.1.0"
description = "Turn a supplied Gaussian splat capture of a plant room into framed equipment, a collision-free route and a cited diagnosis, offline."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "numpy>=2.0",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
  "pillow>=10.4",
  "opencv-contrib-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/server/src/plantpilot"]

[tool.pytest.ini_options]
testpaths = ["app/server/tests"]
pythonpath = ["app/server/src", "app/server/tests"]
addopts = "-q"
