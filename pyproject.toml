[project]
name = "plantpilot"
version = "0.1.0"
description = "Photograph a valve nameplate, get the cited manual page and the next service action, offline."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "opencv-contrib-python-headless>=5.0.0.93",
  "onnxruntime>=1.31.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/server/src/plantpilot"]

[tool.pytest.ini_options]
testpaths = ["app/server/tests"]
pythonpath = ["app/server/src", "app/server/tests"]
addopts = "-q"
