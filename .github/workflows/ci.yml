name: ci

on:
  pull_request:
  push:
    branches: [main]

# What is cached, and what invalidates each cache:
#   uv package cache   astral-sh/setup-uv, keyed on uv.lock
#   npm tarball cache  actions/setup-node, keyed on app/web/package-lock.json
#                      and app/web/package.json
# The test run, the type check and the vite build are rebuilt every time on
# purpose: caching build output would let a broken build stay green.
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and the Python it runs
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          # setup-uv caches the uv package cache by default on GitHub-hosted
          # runners. State it, and key it on the lock file, so the behaviour is
          # visible here and survives a change of action default.
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked
      - run: uv run pytest
      - run: node scripts/sinceai_check.mjs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          # Both files decide the cache key: package-lock.json for a resolved
          # version, package.json for a widened range that no lock change yet
          # reflects.
          cache-dependency-path: |
            app/web/package-lock.json
            app/web/package.json
      - run: npm ci
        working-directory: app/web
      - run: npm test
        working-directory: app/web
      - run: npm run build
        working-directory: app/web

  container:
    # The image is what a host runs, so a Dockerfile that stops building should
    # fail the pull request that breaks it rather than the deploy. The build is
    # not cached on purpose, for the same reason the two jobs above rebuild.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag plantpilot:ci .
